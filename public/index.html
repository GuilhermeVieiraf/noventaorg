<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>noventaorg</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/public/assets/fivecon.png">
    <link rel="apple-touch-icon" href="/public/assets/fivecon.png">
    <link rel="stylesheet" href="/public/assets/css/style.css">
    <!-- Carrega o componente de header -->
    <script src="/public/assets/js/components/header.js"></script>
</head>

<body>
    <!-- O header será inserido automaticamente aqui pelo JavaScript -->

    <!-- Início do Hero (Vídeo) -->
    <section id="hero" class="container">
        <div class="video-noventa">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/k5Q39PREkfY?si=PHT8upSpXw8ktn0C"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>
    <!-- Fim do Hero -->

    <!-- Início das fotos home -->
    <section id="fotos-home" class="container">
        
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home1.webp" alt=" Foto Gabriel, manobra wallride">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home2.webp" alt="Foto Silmar, Ramon e Thales">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home3.webp" alt="foto monumental Thales">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home4.webp" alt="Foto Thales, manobra no-comply">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home5.webp" alt="Adesivo noventao na camisa">
        </div>
        <div class="bloco-foto">
            <video autoplay loop muted playsinline 
            aria-label="Vídeo do Thales raspando o cabelo"
            style="max-width: 100%; height: auto;">
                 <source src="/public/assets/imagens/home/home6.webm" type="video/webm">
                 <source src="/public/assets/imagens/home/home6.mp4" type="video/mp4">
                 Seu navegador não suporta vídeo HTML5.
            </video>
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home7.webp" alt="Foto Ramon, Thales, Miguel e Brivi">
        </div>
        <div class="bloco-foto">
             <video autoplay loop muted playsinline 
             aria-label="Vídeo Manu descendo o morro de skate com o senhor cadeirante"
             style="max-width: 100%; height: auto;">
                 <source src="/public/assets/imagens/home/home8.webm" type="video/webm">
                 <source src="/public/assets/imagens/home/home8.mp4" type="video/mp4">
                 Seu navegador não suporta vídeo HTML5.
            </video>
        </div>
        <div class="bloco-foto">
             <video autoplay loop muted playsinline 
             aria-label="Vídeo adesivo nove"
             style="max-width: 100%; height: auto;">
                 <source src="/public/assets/imagens/home/home9.webm" type="video/webm">
                 <source src="/public/assets/imagens/home/home9.mp4" type="video/mp4">
                 Seu navegador não suporta vídeo HTML5.
            </video>
        </div>
        <div class="bloco-foto">
           <video autoplay loop muted playsinline
           aria-label="Vídeo crianças descendo de skate"
           style="max-width: 100%; height: auto;">
                 <source src="/public/assets/imagens/home/home10.webm" type="video/webm">
                 <source src="/public/assets/imagens/home/home10.mp4" type="video/mp4">
                 Seu navegador não suporta vídeo HTML5.
            </video>
        </div>
        <div class="bloco-foto">
             <video autoplay loop muted playsinline
             aria-label="Vídeo do Manu mandando a manobra rock"
             style="max-width: 100%; height: auto;">
                 <source src="/public/assets/imagens/home/home11.webm" type="video/webm">
                 <source src="/public/assets/imagens/home/home11.mp4" type="video/mp4">
                 Seu navegador não suporta vídeo HTML5.
            </video>
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home12.webp" alt="Foto Miguel de costas">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home13.webp" alt="Foto adesivo nove na grama">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home14.webp" alt="Foto do dogzin">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home15.webp" alt="Foto graffiti noventa e dominio">
        </div>
        <div class="bloco-foto">
            <img src="/public/assets/imagens/home/home16.webp" alt="Foto adesivo noventao amassado na grama">
        </div>
    </section>
    <!-- Fim das fotos home -->

    <!-- Início do Rodapé -->
    <footer class="rodape container">
        <p>&copy; noventa.org</p>
    </footer>
    <!-- Fim do Rodapé -->

    <script src="/public/assets/js/script.js"></script>
</body>

</html>
