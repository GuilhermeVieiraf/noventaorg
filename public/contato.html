<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Contato | noventaorg</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://pub-71edebaaa1c948278b1721aa0eebf837.r2.dev/imagens/fivecon.png">
    <link rel="apple-touch-icon" href="https://pub-71edebaaa1c948278b1721aa0eebf837.r2.dev/imagens/fivecon.png">
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="assets/js/components/header.js"></script>
</head>

<body>
    <div id="preloader">
        <div class="preloader-container">
            <img src="https://pub-71edebaaa1c948278b1721aa0eebf837.r2.dev/imagens/9! png.png" alt="Logo nove"
                class="preloader-logo">
        </div>
        <div class="spinner"></div>
    </div>

    <section class="container" style="min-height: 60vh;">
        <form class="form-contato" id="form-contato">
            <div>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto" required>
            </div>
            <div>
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <div id="footer-placeholder"></div>

    <script src="assets/js/components/footer.js"></script>
    <script src="assets/js/components/preloader.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: "lZO90tBRzS3Yky_kJ",
            });
        })();
    </script>

    <script>
        document.getElementById('form-contato').addEventListener('submit', function (event) {
            event.preventDefault();

            const serviceID = 'service_x8o9j3a';
            const templateID = 'template_kcrn049';

            const btn = event.target.querySelector('button[type="submit"]');
            btn.textContent = 'Enviando...';
            btn.disabled = true;

            emailjs.sendForm(serviceID, templateID, this)
                .then(() => {
                    btn.textContent = 'Enviar';
                    btn.disabled = false;
                    alert('Mensagem enviada com sucesso!');
                    event.target.reset();
                }, (err) => {
                    btn.textContent = 'Enviar';
                    btn.disabled = false;
                    alert('Ocorreu um erro: ' + JSON.stringify(err));
                });
        });
    </script>
</body>

</html>
